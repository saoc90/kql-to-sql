name: Build and Deploy Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1. Rust toolchain for the browser build of the translator (rust/crates/kql-wasm)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI (must match the wasm-bindgen version in rust/Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' rust/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      # 2. Build the WASM translator into the static site (src/WebDemo/wwwroot/kql-wasm/)
      - name: Build kql-wasm
        run: rust/scripts/build-wasm.sh

      # 3. Fix base href for GitHub Pages
      - name: Fix base href for GitHub Pages
        run: sed -i 's|<base href="/" />|<base href="/kql-to-sql/" />|g' src/WebDemo/wwwroot/index.html

      # 4. Add .nojekyll to prevent Jekyll filtering _framework
      - name: Add .nojekyll
        run: touch src/WebDemo/wwwroot/.nojekyll

      # 5. Upload the static site
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/WebDemo/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
